name: Character Action Screenshot Review

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: character-screenshot-review-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  screenshot-review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked dependencies
        run: npm ci
      - name: Validate launcher logic
        run: node scripts/check-launcher.cjs
      - name: Build
        run: npm run build 2>&1 | tee build-review.log
      - name: Validate topology and sampled animation
        run: npm run check:mesh 2>&1 | tee mesh-review.log
      - name: Validate all action poses and events
        run: npx tsx scripts/check-actions.ts 2>&1 | tee action-review.log
      - name: Validate baseline screenshot coverage
        run: node scripts/check-review-coverage.mjs
      - name: Install browser and Chinese font
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Capture baseline and all action screenshots
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > preview.log 2>&1 &
          ready=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = 1
          npm run check:visual 2>&1 | tee baseline-browser-review.log
          npx tsx scripts/review-actions.ts 2>&1 | tee action-browser-review.log
      - name: Confirm CI did not modify source
        run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: character-action-screenshots
          path: |
            review/
            review-actions/
            build-review.log
            mesh-review.log
            action-review.log
            baseline-browser-review.log
            action-browser-review.log
            preview.log
          retention-days: 7
