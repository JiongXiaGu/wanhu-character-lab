name: Character Model Review
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: character-screenshot-review-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  model-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node scripts/check-launcher.cjs
      - run: npm run check:retired
      - run: npm run build 2>&1 | tee build-review.log
      - run: npm run check:mesh 2>&1 | tee mesh-review.log
      - name: Install browser and Chinese fonts
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Review male and female bind, proportions, DIY and FBX deformation
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > preview.log 2>&1 &
          ready=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          npm run check:visual 2>&1 | tee model-browser-review.log
      - run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: character-model-review
          path: |
            review/
            build-review.log
            mesh-review.log
            model-browser-review.log
            preview.log
          retention-days: 7
