name: B1 isolated authoring workspace
on:
  push:
    branches: [feat/back-accessories-b1]
    paths: [.github/workflows/back-b1-workspace.yml]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Package tracked sources and installed dependencies for isolated authoring
        run: |
          git archive HEAD > /tmp/wanhu-back-b1.tar
          tar --append --file=/tmp/wanhu-back-b1.tar node_modules
          gzip /tmp/wanhu-back-b1.tar
      - uses: actions/upload-artifact@v4
        with:
          name: back-b1-authoring-workspace
          path: /tmp/wanhu-back-b1.tar.gz
          retention-days: 1
