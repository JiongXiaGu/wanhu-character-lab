name: Temporary S3 Author Integration
on:
  push:
    branches: [feat/s3-city-guard]
    paths:
      - .github/s3-author.py
      - .github/workflows/s3-authoring.yml
permissions:
  contents: write
concurrency:
  group: s3-author-integration
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply exact-base checked source edits
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('.github/s3-author.py')
          text=p.read_text()
          old='("[\'palace_guard_helmet\',\'frontier_guard_helmet\',\'guard_helmet\'","[\'palace_guard_helmet\',\'frontier_guard_helmet\',\'city_guard_helmet\',\'guard_helmet\'",1)'
          assert text.count(old)==1
          p.write_text(text.replace(old,old[:-2]+'2)'))
          PY
          python3 .github/s3-author.py
      - name: Commit only staged integration to the existing working branch
        env:
          EXPECTED_PARENT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_PARENT"
          test "$(git ls-remote origin refs/heads/feat/s3-city-guard | cut -f1)" = "$EXPECTED_PARENT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --check
          git commit -m 'feat(soldier): integrate city guard with original workshop and three-style checks'
          git push origin HEAD:refs/heads/feat/s3-city-guard
          echo "Integrated source $(git rev-parse HEAD); formal checks and actual WebGL inspection remain required before merge."
