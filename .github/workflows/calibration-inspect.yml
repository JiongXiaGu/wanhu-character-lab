name: Calibration inspection workspace
on:
  push:
    branches: [tmp-male-fbx-calibration-20260919]
    paths: [.github/workflows/calibration-inspect.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Package complete locked dependencies for offline calibration analysis
        run: tar -czf "$RUNNER_TEMP/character-inspect.tgz" node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: calibration-inspection-workspace
          path: ${{ runner.temp }}/character-inspect.tgz
          retention-days: 1
          compression-level: 0
