name: One-shot Motion Evidence
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-motion-evidence.yml
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Capture XR Animator GLB evidence
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/wanhu-preview.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then break; fi
            sleep 1
          done
          mkdir -p motion-evidence
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({args:['--no-sandbox','--use-angle=swiftshader','--enable-webgl']});
          const page=await browser.newPage({viewport:{width:1600,height:1000}});
          const errors=[];
          page.on('pageerror',e=>errors.push(e.message));
          page.on('console',m=>{if(m.type()==='error')errors.push(m.text());});
          await page.goto('http://127.0.0.1:4173/?review=1&paused=1&motion=xr-b-ccae4e25&view=front&compare=1');
          await page.waitForFunction(()=>window.__WANHU_REVIEW__?.getStatus().motion?.ready,{timeout:30000});
          await page.evaluate(()=>window.__WANHU_REVIEW__.seek(.35));
          await page.waitForTimeout(300);
          await page.screenshot({path:'motion-evidence/xinbaodao-b-hybrid-source-target.png'});
          await page.getByLabel('源骨架同步对照',{exact:true}).uncheck();
          await page.waitForTimeout(150);
          await page.screenshot({path:'motion-evidence/xinbaodao-b-hybrid-target.png'});
          const status=await page.evaluate(()=>window.__WANHU_REVIEW__.getStatus());
          if(errors.length)throw new Error(errors.join('\n'));
          console.log(JSON.stringify(status));
          await browser.close();
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: motion-evidence
          path: motion-evidence/
          retention-days: 2
