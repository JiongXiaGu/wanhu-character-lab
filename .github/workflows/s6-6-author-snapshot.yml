name: Temporary S6-6 Author Apply
on:
  push:
    branches: [s6-6-heavy-infantry-rebuild]
    paths: [.github/workflows/s6-6-author-snapshot.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply exact author edits and remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/s6-6-heavy-infantry-rebuild
          test "$(git rev-parse HEAD^)" = 6c09e832fcdbb511f9fbce5c35bab34e149bd1fa
          python3 - <<'PY'
          import base64, hashlib, json, lzma
          from pathlib import Path
          payload = ''''''
          rows = json.loads(lzma.decompress(base64.b64decode(payload)))
          assert len(rows) == 19
          for row in rows:
              path = Path(row['path'])
              assert not path.is_absolute() and '..' not in path.parts
              source = path.read_text()
              assert hashlib.sha256(source.encode()).hexdigest() == row['before'], str(path)
              for start, end, text in reversed(row['edits']):
                  source = source[:start] + text + source[end:]
              assert hashlib.sha256(source.encode()).hexdigest() == row['after'], str(path)
              path.write_text(source)
              print('Verified:', path)
          PY
          git rm .github/workflows/s6-6-author-snapshot.yml
          git diff --check
          test -z "$(git diff -- scripts/check-tailoring-intersections.ts .github/workflows/build.yml .github/workflows/targeted-checks.yml .github/workflows/manual-visual-review.yml)"
          git config user.name 'JiongXiaXia'
          git config user.email 'jiongxiagu@outlook.com'
          git add -u
          git commit -m 'feat(soldier): rebuild S6-6 heavy infantry suit; retain movement failure gate'
          git push origin HEAD:s6-6-heavy-infantry-rebuild
          echo "Candidate: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
