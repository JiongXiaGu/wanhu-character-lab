name: Modular Garment Review
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: modular-garment-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    defaults:
      run:
        shell: bash
        working-directory: candidate
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_SHA }}
          path: baseline
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: candidate/package-lock.json
      - run: npm ci
      - run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install Pillow
      - name: Build candidate and reference (read-only camera hook only)
        run: |
          npm run build
          node scripts/instrument-baseline-camera.mjs ../baseline
          ln -s "$PWD/node_modules" ../baseline/node_modules
          (cd ../baseline && npm run build)
      - name: Smoke test one-command local review (executed in runner)
        run: npm run review:local
      - name: Capture actual before and after in runner
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/modular-after.log 2>&1 &
          (cd ../baseline && npm run preview -- --host 127.0.0.1 --port 4174) > /tmp/modular-before.log 2>&1 &
          for port in 4173 4174; do
            for i in {1..40}; do curl -fsS "http://127.0.0.1:$port/" >/dev/null && break; sleep 1; done
            curl -fsS "http://127.0.0.1:$port/" >/dev/null
          done
          REVIEW_HEAD_SHA="$BASE_SHA" REVIEW_STAGE=before REVIEW_URL=http://127.0.0.1:4174 node scripts/review-modular.mjs
          REVIEW_HEAD_SHA="$HEAD_SHA" REVIEW_STAGE=after REVIEW_URL=http://127.0.0.1:4173 node scripts/review-modular.mjs
          python scripts/compose-modular.py
      - name: Compare bare and clothed knees and seated midline
        run: |
          REVIEW_HEAD_SHA="$BASE_SHA" REVIEW_STAGE=before REVIEW_URL=http://127.0.0.1:4174 npm run review:deformation
          REVIEW_HEAD_SHA="$HEAD_SHA" REVIEW_STAGE=after REVIEW_URL=http://127.0.0.1:4173 npm run review:deformation
          python scripts/compose-deformation.py
      - name: Both clothing batches - original mixes plus lightwear and headwear
        run: |
          REVIEW_HEAD_SHA="$HEAD_SHA" npm run check:wardrobe-batch
          REVIEW_HEAD_SHA="$BASE_SHA" REVIEW_STAGE=before REVIEW_URL=http://127.0.0.1:4174 npm run review:wardrobe-batch
          REVIEW_HEAD_SHA="$HEAD_SHA" REVIEW_STAGE=after REVIEW_URL=http://127.0.0.1:4173 npm run review:wardrobe-batch
          python scripts/compose-wardrobe-batch.py
      - name: Verify source remains unchanged by review
        run: git diff --exit-code
      - name: Preserve diagnostics
        if: always()
        run: |
          mkdir -p review-modular
          cp /tmp/modular-*.log review-modular/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: modular-garment-review-${{ env.HEAD_SHA }}
          path: |
            candidate/review-modular/
            candidate/review-deformation/
            candidate/review-wardrobe-batch/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wardrobe-batch-keyframes
          path: |
            candidate/review-wardrobe-batch/*.jpg
            candidate/review-wardrobe-batch/*.json
            candidate/review-wardrobe-batch/after/report.json
            candidate/review-wardrobe-batch/before/report.json
            candidate/review-wardrobe-batch/after/workbench.png
            candidate/review-wardrobe-batch/lightwear-after/report.json
            candidate/review-wardrobe-batch/lightwear-before/report.json
            candidate/review-wardrobe-batch/lightwear-after/workbench.png
          retention-days: 14

  skirts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    defaults:
      run:
        shell: bash
        working-directory: candidate
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_SHA }}
          path: baseline
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: candidate/package-lock.json
      - run: npm ci
      - name: Install actual browser and contact-sheet dependencies
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install Pillow
      - name: Build exact candidate and read-only baseline
        run: |
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          npm run build
          node scripts/instrument-baseline-camera.mjs ../baseline
          ln -s "$PWD/node_modules" ../baseline/node_modules
          (cd ../baseline && npm run build)
      - name: Verify continuous skirt numeric contracts
        run: REVIEW_HEAD_SHA="$HEAD_SHA" npm run check:skirts
      - name: Run local review entry in runner (not a local-machine claim)
        run: REVIEW_HEAD_SHA="$HEAD_SHA" npm run review:local -- --skirts
      - name: Preserve all 52 baseline and 412 candidate frames
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/skirts-after.log 2>&1 &
          (cd ../baseline && npm run preview -- --host 127.0.0.1 --port 4174) > /tmp/skirts-before.log 2>&1 &
          for port in 4173 4174; do
            for i in {1..40}; do curl -fsS "http://127.0.0.1:$port/" >/dev/null && break; sleep 1; done
            curl -fsS "http://127.0.0.1:$port/" >/dev/null
          done
          REVIEW_HEAD_SHA="$BASE_SHA" REVIEW_STAGE=before REVIEW_URL=http://127.0.0.1:4174 npm run review:skirts
          REVIEW_HEAD_SHA="$HEAD_SHA" REVIEW_STAGE=after REVIEW_URL=http://127.0.0.1:4173 npm run review:skirts
      - name: Confirm read-only review
        run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: continuous-skirts-keyframes
          path: candidate/review-wardrobe-batch/skirts-*
          retention-days: 14
