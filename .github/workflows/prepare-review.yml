name: Prepare V3 Review Environment
on:
  push:
    branches: [rebuild/character-v3]
    paths: [.github/workflows/prepare-review.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned review toolchain
        run: |
          mkdir -p /tmp/wanhu-review/tools /tmp/wanhu-review/project
          cd /tmp/wanhu-review/tools
          npm init -y
          npm install --save-exact three@0.180.0 @types/three@0.180.0 react@19.1.1 react-dom@19.1.1 @types/react@19.1.16 @types/react-dom@19.1.9 typescript@5.9.2 tsx@4.20.5 vite@7.1.7 @vitejs/plugin-react@5.0.4 playwright@1.55.0
      - name: Package public source and dependency toolchain
        run: |
          git archive HEAD | tar -x -C /tmp/wanhu-review/project
          tar -czf /tmp/wanhu-review-runtime.tar.gz -C /tmp/wanhu-review tools project
      - uses: actions/upload-artifact@v4
        with:
          name: wanhu-review-runtime
          path: /tmp/wanhu-review-runtime.tar.gz
          retention-days: 1
