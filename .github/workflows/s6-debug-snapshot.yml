name: S6-4 Diagnostic Snapshot (temporary)
on:
  pull_request:
    paths: [.github/workflows/s6-debug-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prepare:motion
      - name: Capture source and computed motion for isolated diagnostics
        run: |
          git rev-parse HEAD > /tmp/SOURCE_SHA
          tar -czf /tmp/s6-workbench.tar.gz src scripts Documentation public .github AGENTS.md README.md package*.json tsconfig* vite.config* index.html node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: s6-workbench-${{ github.event.pull_request.head.sha }}
          path: |
            /tmp/s6-workbench.tar.gz
            /tmp/SOURCE_SHA
          compression-level: 0
          retention-days: 1
