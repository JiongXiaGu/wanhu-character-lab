name: M1 Temporary Bootstrap
on:
  push:
    branches: [feat/phase-m1-horse-lab-20260921]
    paths: [.github/workflows/phase-m1-bootstrap.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Package tracked source and exact dependencies for this isolated execution environment
        run: |
          mkdir -p /tmp/m1-workspace
          git archive HEAD | tar -x -C /tmp/m1-workspace
          cp -a node_modules /tmp/m1-workspace/node_modules
          git rev-parse HEAD > /tmp/m1-workspace/SOURCE_SHA
          tar -C /tmp/m1-workspace -czf /tmp/m1-workspace.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: m1-bootstrap-workspace
          path: /tmp/m1-workspace.tar.gz
          retention-days: 1
