name: M8 Workspace Snapshot (temporary)
on:
  push:
    branches: [work/m8-water-buffalo]
    paths: [.github/workflows/m8-workspace-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Archive source and installed dependencies without credentials
        run: |
          git rev-parse HEAD > SOURCE_SHA.txt
          tar --exclude=.git -czf /tmp/m8-workspace.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: m8-workspace
          path: /tmp/m8-workspace.tar.gz
          retention-days: 1
