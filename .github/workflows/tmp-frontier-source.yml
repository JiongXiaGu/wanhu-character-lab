name: Temporary S2 author snapshot
on:
  push:
    branches: [feat/s2-frontier-guard]
    paths: [.github/workflows/tmp-frontier-source.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Integration sites
        run: git grep -n -E 'palace_guard|applyPalace|isPalace|PalaceHelmet|PalaceLiner' -- src scripts .github
      - name: Source contracts
        run: |
          for f in src/character/wardrobe/assets/tops.ts src/character/wardrobe/assets/trousers.ts src/character/wardrobe/assets/top-seams.ts scripts/check-soldier.ts scripts/check-soldier-assets.ts scripts/check-soldier-skirt.ts scripts/check-soldier-browser.mjs .github/workflows/targeted-checks.yml .github/workflows/manual-visual-review.yml; do
            echo "===== $f ====="
            if test -f "$f"; then cat "$f"; fi
          done
