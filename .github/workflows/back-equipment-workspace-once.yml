name: Back Equipment Workspace (temporary)
on:
  push:
    branches: [work/back-equipment-20260924]
    paths: [.github/workflows/back-equipment-workspace-once.yml]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Export source and installed dependencies for offline implementation
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > .workspace-source-sha
          tar --exclude='./.git' -czf /tmp/wanhu-back-workspace.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: back-workspace-source
          path: /tmp/wanhu-back-workspace.tgz
          retention-days: 1
