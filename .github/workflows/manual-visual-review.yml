name: Manual Visual Review
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: c1-remodel-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  authoring-source:
    if: github.head_ref == 'c1-narrow-long-robe'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/prepare-motion
      - name: Read-only offline source export
        run: |
          set -euo pipefail
          git archive HEAD | gzip > /tmp/c1-remodel-code.tgz
          tar -czf /tmp/c1-remodel-deps.tgz node_modules
          tar -czf /tmp/c1-remodel-motion.tgz public/mixamo public/system-animator
      - uses: actions/upload-artifact@v4
        with:
          name: c1-remodel-offline-source
          path: /tmp/c1-remodel-*.tgz
          compression-level: 0
          retention-days: 1
