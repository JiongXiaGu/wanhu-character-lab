name: Manual Visual Review
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review, converted_to_draft]
  workflow_dispatch:
    inputs:
      scope:
        description: Visual area to capture
        required: true
        type: choice
        default: wardrobe
        options:
          - character
          - back-equipment
          - soldier
          - soldier-heavy-fast
          - wardrobe
          - lightwear
          - skirts
          - motion
          - system-animator
          - horse
          - livestock
          - all
      full:
        description: Generate the full screenshot matrix when supported
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: manual-visual-${{ github.ref }}-${{ inputs.scope }}
  cancel-in-progress: true
jobs:
  review:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.title, '[back-visual]') || contains(github.event.pull_request.title, '[soldier-visual]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REVIEW_HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - id: lane
        uses: ./.github/actions/heavy-review-scope
        with:
          scope: ${{ inputs.scope == 'soldier-heavy-fast' && 'soldier-heavy-authoring' || 'auto' }}
      - id: visual
        name: Separate Draft preview from Ready release evidence
        env:
          REQUESTED_SCOPE: ${{ inputs.scope || (contains(github.event.pull_request.title, '[soldier-visual]') && 'soldier' || 'back-equipment') }}
          REVIEW_LANE: ${{ steps.lane.outputs.lane }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          set -euo pipefail
          SCOPE="$REQUESTED_SCOPE"
          if [[ "$SCOPE" == soldier && "$IS_DRAFT" == true && "$REVIEW_LANE" == candidate ]]; then
            SCOPE=soldier-heavy-fast
          elif [[ "$SCOPE" == soldier-heavy-fast && "$REVIEW_LANE" == release ]]; then
            SCOPE=soldier
          fi
          echo "scope=$SCOPE" >> "$GITHUB_OUTPUT"
          echo "Visual scope: $SCOPE ($REVIEW_HEAD_SHA)"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/prepare-motion
        if: steps.visual.outputs.scope != 'soldier-heavy-fast'
      - name: Build exact candidate
        run: npm run build --ignore-scripts
      - name: Install browser and Chinese fonts
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Generate requested visual evidence
        shell: bash
        env:
          SCOPE: ${{ steps.visual.outputs.scope }}
          FULL: ${{ inputs.full }}
        run: |
          set -euo pipefail
          : > manual-visual-review.log
          extra=()
          if [[ "$FULL" == "true" ]]; then extra+=(--full); fi
          run_scope() {
            local scope="$1"
            echo "=== visual scope: $scope ===" | tee -a manual-visual-review.log
            if [[ "$scope" == back-equipment ]]; then
              node scripts/check-back-equipment-browser.mjs --screenshots 2>&1 | tee -a manual-visual-review.log
            elif [[ "$scope" == soldier ]]; then
              npm run review:soldier 2>&1 | tee -a manual-visual-review.log
            elif [[ "$scope" == soldier-heavy-fast ]]; then
              npm run review:soldier-heavy-fast 2>&1 | tee -a manual-visual-review.log
            elif [[ "$scope" == livestock ]]; then
              npm run review:livestock 2>&1 | tee -a manual-visual-review.log
            elif [[ "$scope" == system-animator ]]; then
              npm run review:local -- --system-animator 2>&1 | tee -a manual-visual-review.log
            else
              npm run review:local -- "--$scope" "${extra[@]}" 2>&1 | tee -a manual-visual-review.log
            fi
          }
          case "$SCOPE" in
            character|back-equipment|soldier|soldier-heavy-fast|wardrobe|lightwear|skirts|motion|system-animator|horse|livestock)
              run_scope "$SCOPE"
              ;;
            all)
              for scope in character back-equipment soldier wardrobe lightwear skirts motion horse livestock; do
                run_scope "$scope"
              done
              ;;
            *)
              echo "Unknown visual scope: $SCOPE" >&2
              exit 2
              ;;
          esac
          {
            echo "### Manual visual review evidence"
            echo ""
            echo "- Scope: $SCOPE"
            echo "- Full matrix: $FULL"
            echo "- SHA: $REVIEW_HEAD_SHA"
            echo "- Screenshots were generated only. Human visual approval is still required."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Review must not mutate tracked source
        run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manual-visual-${{ steps.visual.outputs.scope }}-${{ env.REVIEW_HEAD_SHA }}
          path: |
            review/
            review-motion/
            review-system-animator/
            review-deformation/
            review-wardrobe-batch/
            manual-visual-review.log
          if-no-files-found: ignore
          retention-days: 14
