name: Manual Visual Review
on:
  push:
    branches: [tmp/duck-workspace-20260924]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a44bb9cb1948c9ec735eea9859ae3ce5f8fe4227
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prepare:mixamo
      - name: Package offline authoring inputs (no credentials or Git directory)
        run: |
          git rev-parse HEAD > SOURCE_SHA.txt
          tar --exclude=./.git --exclude=./dist --exclude=./review --exclude='*.fbx' --exclude='*.bvh' -czf /tmp/duck-workspace.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: duck-authoring-workspace-a44bb9c
          path: /tmp/duck-workspace.tar.gz
          retention-days: 1
