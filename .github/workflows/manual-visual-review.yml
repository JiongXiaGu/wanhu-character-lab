name: Manual Visual Review
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  authoring-browser:
    if: github.head_ref == 'c1-narrow-long-robe'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --only-shell chromium
      - name: Read-only browser export
        run: |
          tar -czf /tmp/c1-headless.tgz -C "$HOME/.cache/ms-playwright" .
          ls -lh /tmp/c1-headless.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: c1-authoring-browser
          path: /tmp/c1-headless.tgz
          compression-level: 0
          retention-days: 1
