name: Temporary Soldier Finish Integration
on:
  push:
    branches: [feat/soldier-palace-s1]
    paths: [.github/workflows/soldier-authoring-transfer.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/soldier-palace-s1
      - name: Integrate reviewed source and stage workflow text for connector write
        run: |
          set -euo pipefail
          python .github/soldier-finish.py
          cp .github/workflows/targeted-checks.yml .github/soldier-targeted.txt
          cp .github/workflows/manual-visual-review.yml .github/soldier-visual.txt
          git restore .github/workflows/targeted-checks.yml .github/workflows/manual-visual-review.yml
          git rm .github/soldier-finish.py .github/workflows/soldier-authoring-transfer.yml
          git add src scripts package.json Documentation README.md AGENTS.md .github
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(soldier): refine palace plates, checks and documentation'
          git push origin HEAD:feat/soldier-palace-s1
          git rev-parse HEAD
