name: Temporary Soldier Authoring Bundle
on:
  push:
    branches: [feat/soldier-palace-s1]
    paths: [.github/workflows/soldier-authoring-transfer.yml]
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prepare:motion
      - name: Package source and prepared motions without FBX reference binaries
        run: |
          git rev-parse HEAD > /tmp/source-sha.txt
          du -sh src scripts public node_modules
          tar -czf /tmp/soldier-source.tar.gz src scripts public Documentation node_modules .github .gitignore AGENTS.md README.md package.json package-lock.json tsconfig.json vite.config.ts index.html
      - uses: actions/upload-artifact@v4
        with:
          name: soldier-s1-source-small
          path: |
            /tmp/source-sha.txt
            /tmp/soldier-source.tar.gz
          retention-days: 1
