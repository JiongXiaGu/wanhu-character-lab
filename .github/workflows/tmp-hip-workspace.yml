name: Hip Workspace Snapshot
on:
  push:
    branches: [tmp-standard-hip-gusset]
    paths: [.github/workflows/tmp-hip-workspace.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prepare:mixamo
      - name: Archive source and offline dependencies (no git credentials)
        run: |
          mkdir -p /tmp/hip-workspace
          tar --exclude=.git --exclude=node_modules --exclude=dist -czf /tmp/hip-workspace/source.tgz .
          tar -czf /tmp/hip-workspace/dependencies.tgz node_modules
          git rev-parse HEAD > /tmp/hip-workspace/commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: hip-workspace
          path: /tmp/hip-workspace
          retention-days: 3
