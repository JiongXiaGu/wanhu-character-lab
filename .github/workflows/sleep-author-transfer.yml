name: Temporary sleep author transfer
on:
  push:
    branches: [feat/pig-dog-sleep-20260925]
    paths: [.github/workflows/sleep-author-transfer.yml]
permissions:
  contents: read
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Archive dependencies for local author checks
        run: |
          mkdir -p /tmp/author-transfer
          tar -czf /tmp/author-transfer/dependencies.tgz node_modules
          git rev-parse HEAD > /tmp/author-transfer/source-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: sleep-author-dependencies
          path: /tmp/author-transfer/
          retention-days: 1
