name: Batch Two Diagnostics
on:
  push:
    branches: [prep/wardrobe-batch-two]
    paths: [.github/workflows/batch-two-diagnostics.yml]
permissions:
  contents: read
jobs:
  numeric:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REVISION: '2'
    defaults:
      run:
        working-directory: work
    steps:
      - uses: actions/checkout@v4
        with:
          path: task
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: feebadf7451c53a2637c6cd828ba6d617f15a5ce
          path: work
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: work/package-lock.json
      - run: |
          python3 ../task/.batch-two/apply.py
          python3 ../task/.batch-two/refine.py
          python3 ../task/.batch-two/postflight.py
          cp ../task/.batch-two/check-lightwear.ts scripts/
          cp ../task/.batch-two/review-lightwear.mjs scripts/
          cp ../task/.batch-two/compose-lightwear.py scripts/
          npm ci
      - name: Static lightwear and all original mesh contracts
        run: npm run check:mesh
      - name: Full source-key and midpoint lower-body intersections
        if: always()
        run: |
          npm run prepare:mixamo
          npm run check:intersections
