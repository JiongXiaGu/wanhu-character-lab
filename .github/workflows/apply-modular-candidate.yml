name: Apply Modular Candidate
on:
  push:
    branches: [feat/modular-garment-assets]
    paths: [.github/workflows/apply-modular-candidate.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 16
      - name: Verify and apply source delta atomically
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma, pathlib, subprocess
          base = '92a67214448c149b43f2d2018913151731d404a9'
          carriers = {f'.github/candidate-delta-{i}.txt' for i in range(5)}
          allowed = carriers | {'.github/workflows/apply-modular-candidate.yml'}
          changed = set(subprocess.check_output(['git','diff','--name-only',base,'HEAD'], text=True).splitlines())
          assert changed <= allowed, ('Concurrent source changes', changed - allowed)
          encoded = ''.join(pathlib.Path(f'.github/candidate-delta-{i}.txt').read_text().strip() for i in range(5))
          data = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(data).hexdigest() == '7596848a3f389cffc1c14940d04e47b2b93661a0eecea9c8e7449ab8a5c7101f', 'Payload mismatch'
          delta = json.loads(data)
          assert delta['base'] == base
          prepared = []
          seen = set()
          for item in delta['files']:
              name = item['path']; path = pathlib.Path(name)
              assert name not in seen and not path.is_absolute() and '..' not in path.parts
              seen.add(name)
              assert name.startswith(('src/','scripts/','Documentation/','.github/workflows/')) or name in ['README.md','AGENTS.md','package.json','.gitignore']
              original = path.read_bytes() if path.exists() else b''
              if item['old'] is None:
                  assert not path.exists(), ('Unexpected existing file', name)
              else:
                  h = hashlib.sha1(b'blob ' + str(len(original)).encode() + b'\0' + original).hexdigest()
                  assert path.exists() and h == item['old'], ('Original hash mismatch', name)
              old = original.decode('utf-8')
              ops = item['ops']
              text = None if ops is None else ''.join(old[op[0]:op[1]] if isinstance(op,list) else op for op in ops)
              # Workflow mutations are applied separately by the authorized connector.
              if not name.startswith('.github/workflows/'):
                  prepared.append((path,text))
          for path,text in prepared:
              if text is None:
                  path.unlink()
              else:
                  path.parent.mkdir(parents=True,exist_ok=True)
                  path.write_text(text,encoding='utf-8')
          for name in carriers:
              pathlib.Path(name).unlink()
          print('Applied', len(prepared), 'source/document paths; workflow edits reserved for connector')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'feat: independent garment assets, fixed coverage and image review'
          remote=$(git ls-remote origin refs/heads/feat/modular-garment-assets | cut -f1)
          test "$remote" = "$GITHUB_SHA"
          git push origin HEAD:feat/modular-garment-assets
