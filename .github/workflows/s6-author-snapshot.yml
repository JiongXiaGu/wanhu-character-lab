name: S6 Author Checks (temporary)
on:
  push:
    branches: [s6-heavy-armor]
    paths:
      - .github/workflows/s6-author-snapshot.yml
      - .s6-author-tune.py
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  author:
    if: github.ref == 'refs/heads/s6-heavy-armor'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build 2>&1 | tee s6-build.log
      - name: Correct skirt motion deformation
        id: tune
        run: python3 .s6-author-tune.py 2>&1 | tee s6-tuning.log
      - name: Commit only authored correction
        if: steps.tune.outcome == 'success'
        run: |
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/character/wardrobe/assets/military/heavy-skirt.ts scripts/check-soldier-heavy.ts
            git commit -m 'fix(s6): smooth heavy skirt hip-to-thigh deformation through full source sampling'
            git push origin HEAD:s6-heavy-armor
          fi
          echo "REVIEW_HEAD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Soldier exact topology and state matrix
        if: ${{ !cancelled() }}
        run: npm run check:soldier 2>&1 | tee s6-soldier.log
      - name: Original complete tailoring intersections
        if: ${{ !cancelled() }}
        run: npm run check:intersections 2>&1 | tee s6-intersections.log
      - name: Heavy upper intersections
        if: ${{ !cancelled() }}
        run: npx tsx scripts/check-soldier-upper-intersections.ts 2>&1 | tee s6-upper.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s6-author-checks-${{ github.sha }}
          path: |
            s6-*.log
            s6-tuning.json
            review/soldier-numeric/
            review-tailoring-v2/intersections.json
          retention-days: 3
