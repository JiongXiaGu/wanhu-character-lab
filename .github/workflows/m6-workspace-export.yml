name: M6 temporary workspace export
on:
  push:
    branches: [codex/m6-cattle-yellow-20260923]
    paths: [.github/workflows/m6-workspace-export.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Package isolated authoring workspace
        run: |
          git rev-parse HEAD > SOURCE_SHA.txt
          tar --exclude=.git --exclude=artifacts --exclude=dist -czf /tmp/m6-workspace.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: m6-authoring-workspace
          path: /tmp/m6-workspace.tar.gz
          retention-days: 1
