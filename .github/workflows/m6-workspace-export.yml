name: M6 temporary authoring verification
on:
  push:
    branches: [codex/m6-cattle-yellow-20260923]
concurrency:
  group: m6-authoring-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RIDING_CHECK_DIR: /tmp/wanhu-riding-checks
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrate authored cattle on the isolated task branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'codex/m6-cattle-yellow-20260923'
          if test -f .tmp-m6-integrate.py; then
            python3 .tmp-m6-integrate.py
            rm .tmp-m6-integrate.py
            # Official workflow wiring is committed separately through the authorized connector.
            git restore .github/workflows/targeted-checks.yml
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A -- src scripts .tmp-m6-integrate.py
            git commit -m 'feat: register cattle and extend numeric and browser mount checks'
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
          echo "REVIEW_HEAD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git rev-parse HEAD
          git diff --stat 613df82ef18581a81c877081b27268d00f4b35a3 HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: First cattle authoring checks
        run: npx tsx -e "import { checkCattle } from './scripts/mount-cattle-checks.ts'; console.log(JSON.stringify(checkCattle(), null, 2));"
      - name: Build
        run: npm run build
      - name: All mount numeric checks
        run: npm run check:mounts
      - name: Original riding and saddle regressions
        run: npm run check:riding && npm run check:saddles && npm run check:horse
      - name: Core character checks
        run: npm run check:core
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: All desktop interaction checks without screenshots
        run: npm run check:mounts-browser && npm run check:riding-browser && npm run check:saddles-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m6-authoring-checks
          path: /tmp/wanhu-riding-checks
          if-no-files-found: ignore
          retention-days: 3
