name: Temporary S2 Tree Assembly
on:
  push:
    branches: [feat/s2-frontier-guard]
    paths:
      - .github/workflows/s2-tree-assembly.yml
      - .github/s2-edits-a.json
      - .github/s2-edits-b.json
      - .github/s2-edits-c.json
permissions:
  contents: read
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate authoring files without repository writes
        env:
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import hashlib, json, os, pathlib, tarfile
          root=pathlib.Path.cwd()
          output=pathlib.Path('/tmp/s2-stage')
          output.mkdir()
          def blob(data):
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          seen=set(); changes=[]
          for suffix in 'abc':
              manifest=json.loads((root/f'.github/s2-edits-{suffix}.json').read_text())
              assert manifest['base']=='b72e27d07c1db4d2357c1768b2e62f621e1cc299'
              for entry in manifest['entries']:
                  path=entry['path']; relative=pathlib.PurePosixPath(path)
                  assert not relative.is_absolute() and '..' not in relative.parts and path not in seen
                  seen.add(path); target=root/path
                  if entry['old'] is None:
                      assert not target.exists(), path+' already exists'
                      text=''
                  else:
                      raw=target.read_bytes()
                      assert blob(raw)==entry['old'],path+' old SHA mismatch'
                      text=raw.decode('utf-8')
                  end=0
                  for start,stop,replacement in entry['edits']:
                      assert end<=start<=stop<=len(text) and isinstance(replacement,str),path+' invalid edit'
                      end=stop
                  for start,stop,replacement in reversed(entry['edits']):
                      text=text[:start]+replacement+text[stop:]
                  raw=text.encode('utf-8')
                  if entry['new'] is None:
                      assert not raw
                  else:
                      assert blob(raw)==entry['new'],path+' new SHA mismatch'
                      dest=output/path
                      dest.parent.mkdir(parents=True,exist_ok=True)
                      dest.write_bytes(raw)
                  changes.append({'path':path,'old':entry['old'],'new':entry['new']})
          for path in ['.github/s2-edits-a.json','.github/s2-edits-b.json','.github/s2-edits-c.json','.github/workflows/s2-tree-assembly.yml']:
              changes.append({'path':path,'old':blob((root/path).read_bytes()),'new':None})
          evidence={'parent':os.environ['SOURCE_SHA'],'base':'b72e27d07c1db4d2357c1768b2e62f621e1cc299','changes':changes}
          (output/'s2-applied.json').write_text(json.dumps(evidence,ensure_ascii=False,indent=2))
          with tarfile.open('/tmp/s2-verified-files.tar.gz','w:gz') as archive:
              archive.add(output,arcname='.')
          print(json.dumps(evidence,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: s2-verified-authoring-files
          path: /tmp/s2-verified-files.tar.gz
          retention-days: 1
