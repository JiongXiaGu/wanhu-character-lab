name: Deformation Candidate Review
on:
  push:
    branches: [fix/lowpoly-deformation-cages]
    paths: [.github/workflows/deformation-candidate.yml]
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: candidate
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/lowpoly-deformation-cages
          path: candidate
      - uses: actions/checkout@v4
        with:
          ref: f432357f1cf2a5219acbae87e7e1b0e1cca9481d
          path: baseline
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: candidate/package-lock.json
      - name: Apply exact audited source edits on isolated task branch
        id: apply
        run: |
          if [ ! -f src/character/v3/leg-deformation.ts ]; then
            node scripts/apply-deformation-candidate.mjs
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src scripts/check-tailoring-intersections.ts
            git commit -m 'fix: correct independent trousers knees and skin crotch influence'
            git push origin HEAD:refs/heads/fix/lowpoly-deformation-cages
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - name: Build candidate and unchanged reference
        id: build
        run: |
          npm run build
          ln -s "$PWD/node_modules" ../baseline/node_modules
          (cd ../baseline && npm run build)
      - name: Numeric and deformation contracts (body golden remains pending explicit review)
        id: numeric
        continue-on-error: true
        run: |
          npm run check:retired
          npx tsx scripts/check-v3.ts
          npx tsx scripts/check-garment-assets.ts
          npx tsx scripts/check-deformation.ts
          npm run check:mixamo
          npm run check:wardrobe
          npm run check:tailoring
      - name: Install screenshot tools
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install Pillow
      - name: Actual bare-versus-clothed screenshot comparison
        id: images
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          SOURCE_SHA: ${{ steps.apply.outputs.sha }}
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/deformation-after.log 2>&1 &
          (cd ../baseline && npm run preview -- --host 127.0.0.1 --port 4174) > /tmp/deformation-before.log 2>&1 &
          for port in 4173 4174; do
            for i in {1..40}; do curl -fsS "http://127.0.0.1:$port/" >/dev/null && break; sleep 1; done
            curl -fsS "http://127.0.0.1:$port/" >/dev/null
          done
          REVIEW_HEAD_SHA=f432357f1cf2a5219acbae87e7e1b0e1cca9481d REVIEW_STAGE=before REVIEW_URL=http://127.0.0.1:4174 node scripts/review-deformation.mjs
          REVIEW_HEAD_SHA="$SOURCE_SHA" REVIEW_STAGE=after REVIEW_URL=http://127.0.0.1:4173 node scripts/review-deformation.mjs
          python scripts/compose-deformation.py
      - name: Publish only screenshot evidence on separate review ref (no site deployment)
        if: ${{ !cancelled() && steps.images.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.apply.outputs.sha }}
        run: python scripts/publish-deformation-evidence.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deformation-candidate-review
          path: |
            candidate/review-deformation/
            candidate/review-tailoring-v2/
          retention-days: 7
      - name: Do not turn numeric failures into a green review
        if: always()
        env:
          NUMERIC: ${{ steps.numeric.outcome }}
          IMAGES: ${{ steps.images.outcome }}
        run: test "$NUMERIC" = success && test "$IMAGES" = success
