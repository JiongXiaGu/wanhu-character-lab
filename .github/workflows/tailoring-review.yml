name: Tailoring Review
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: tailoring-review-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  tailoring:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:retired
      - name: Build immutable candidate
        run: npm run build 2>&1 | tee tailoring-build-review.log
      - name: Check tailoring, continuous liners and sampled intersections
        id: numeric
        continue-on-error: true
        run: npm run check:tailoring 2>&1 | tee tailoring-numeric-review.log
      - name: Print numerical witnesses
        if: always()
        run: |
          if test -f review-tailoring/numeric.json; then
            node --input-type=module -e "import fs from 'node:fs';const r=JSON.parse(fs.readFileSync('review-tailoring/numeric.json'));console.log(JSON.stringify({...r,staticRows:r.staticRows,motionRows:r.motionRows,failures:r.failures.slice(0,8)},null,2));"
          fi
      - name: Install local browser and Chinese fonts
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Capture actual tailoring and seated fitting
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > tailoring-preview.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          ready=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          npm run review:tailoring 2>&1 | tee tailoring-browser-review.log
      - name: Assert complete and passing evidence
        env:
          NUMERIC_OUTCOME: ${{ steps.numeric.outcome }}
        run: |
          test "$NUMERIC_OUTCOME" = success
          node --input-type=module -e "import fs from 'node:fs';import assert from 'node:assert/strict';const n=JSON.parse(fs.readFileSync('review-tailoring/numeric.json'));const r=JSON.parse(fs.readFileSync('review-tailoring/report.json'));assert(n.passed&&!n.staticOnly);assert(r.passed);assert.equal(r.images,414);assert.equal(r.continuousVideos.length,10);assert(r.criticalClips.includes('pilot-switches'));assert.equal(r.sourceSha,process.env.REVIEW_HEAD_SHA);"
      - run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tailoring-review
          path: |
            review-tailoring/
            tailoring-*-review.log
            tailoring-preview.log
          retention-days: 7
