name: Poultry Sleep Authoring Workbench
on:
  push:
    branches: [poultry-sleep-20260924]
    paths: [.github/workflows/poultry-sleep-workbench.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Package only numeric authoring sources
        run: |
          mkdir -p /tmp/poultry-workbench
          git rev-parse HEAD > /tmp/poultry-workbench/source-sha.txt
          tar -czf /tmp/poultry-workbench/source.tar.gz src scripts Documentation AGENTS.md README.md package.json package-lock.json tsconfig.json index.html
          tar -czf /tmp/poultry-workbench/dependencies.tar.gz node_modules/three node_modules/tsx node_modules/esbuild node_modules/@esbuild node_modules/get-tsconfig node_modules/resolve-pkg-maps node_modules/typescript node_modules/@types
          du -sh /tmp/poultry-workbench/*
      - uses: actions/upload-artifact@v4
        with:
          name: poultry-authoring-workbench-small
          path: /tmp/poultry-workbench/
          retention-days: 1
