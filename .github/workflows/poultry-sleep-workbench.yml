name: Poultry Sleep Authoring Workbench
on:
  push:
    branches: [poultry-sleep-20260924]
    paths: [.github/workflows/poultry-sleep-workbench.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/poultry-sleep-20260924'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply exact locally checked sleep patch
        run: |
          set -euo pipefail
          cat .poultry-sleep-patch-1.bin .poultry-sleep-patch-2.bin | gzip -dc > /tmp/poultry-sleep.patch
          echo 'e3a28ece288d1b29fef22660e8ca87a6298cad51b4ad16b1b0be227db9f518ec  /tmp/poultry-sleep.patch' | sha256sum -c -
          git apply --check /tmp/poultry-sleep.patch
          git apply /tmp/poultry-sleep.patch
          git diff --check
      - run: npm ci
      - run: npm run check:livestock
      - run: npm run build
      - name: Commit only authorized poultry sources without force
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch origin poultry-sleep-20260924
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AGENTS.md README.md Documentation scripts/check-livestock* src/chicken/AGENTS.md src/chicken/animation.ts src/duck/AGENTS.md src/duck/animation.ts src/goose/AGENTS.md src/goose/animation.ts
          git rm .poultry-sleep-patch-1.bin .poultry-sleep-patch-2.bin
          git commit -m 'feat: add land sleep clips for chicken duck and goose with regression checks'
          git push origin HEAD:refs/heads/poultry-sleep-20260924
