name: Palace author snapshot (temporary)
on:
  pull_request:
    paths: ['.github/workflows/palace-author-once.yml']
permissions:
  contents: read
jobs:
  snapshot:
    if: github.head_ref == 'fix/palace-waist-skirt'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run prepare:motion
      # Only tracked project content and public build dependencies; no git credentials or runner environment.
      - name: Export isolated authoring source
        run: |
          mkdir -p /tmp/palace-author
          git archive HEAD | tar -xf - -C /tmp/palace-author
          cp -a node_modules /tmp/palace-author/
          cp -a public/. /tmp/palace-author/public/
          git rev-parse HEAD > /tmp/palace-author/source-sha.txt
          tar -czf /tmp/palace-author.tar.gz -C /tmp/palace-author .
      - uses: actions/upload-artifact@v4
        with:
          name: palace-author-snapshot
          path: /tmp/palace-author.tar.gz
          retention-days: 1
