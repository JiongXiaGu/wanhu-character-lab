name: Build & Core Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: build-core-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REVIEW_HEAD_SHA }}
          persist-credentials: false
      - name: Record exact source
        run: test "$(git rev-parse HEAD)" = "$REVIEW_HEAD_SHA" && echo "$REVIEW_HEAD_SHA"
      - name: Export exact C2 repair input (temporary, not test evidence)
        if: github.head_ref == 'c2-court-maid-high-waist-set'
        run: |
          mkdir -p "$RUNNER_TEMP/c2-repair"
          git ls-files -z '*.ts' '*.tsx' '*.mjs' '*.md' '*.json' '*.yml' '*.css' '*.html' '*.svg' '.gitignore' | tar --null -T - -czf "$RUNNER_TEMP/c2-repair/source.tgz"
          git rev-parse HEAD > "$RUNNER_TEMP/c2-repair/SOURCE_SHA"
      - uses: actions/upload-artifact@v4
        if: github.head_ref == 'c2-court-maid-high-waist-set'
        with:
          name: c2-repair-source-${{ env.REVIEW_HEAD_SHA }}
          path: ${{ runner.temp }}/c2-repair/
          retention-days: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: CI graph and coverage guard checks
        run: node scripts/check-ci-graph.mjs
      - name: Retired contract checks
        run: npm run check:retired
      - name: Core mesh and data checks
        run: npm run check:core
      - name: Back equipment topology, bind and Recipe V5 checks
        run: npx tsx scripts/check-back-equipment.ts
      - uses: ./.github/actions/prepare-motion
      - name: TypeScript and production build
        run: npm run build --ignore-scripts
      - name: Back equipment source-key animation and riding checks
        run: npx tsx scripts/check-back-equipment.ts --motion
      - name: Checks must not mutate tracked source
        run: git diff --exit-code && test "$(git rev-parse HEAD)" = "$REVIEW_HEAD_SHA"
