name: Build & Core Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: build-core-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REVIEW_HEAD_SHA }}
          persist-credentials: false
      - name: Record exact source
        run: test "$(git rev-parse HEAD)" = "$REVIEW_HEAD_SHA" && echo "$REVIEW_HEAD_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Temporary task workspace snapshot
        if: github.head_ref == 'feat/l6-rural-dog-pig-eyes'
        run: |
          git archive --format=tar HEAD > /tmp/wanhu-task-source.tar
          tar -czf /tmp/wanhu-task-dependencies.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        if: github.head_ref == 'feat/l6-rural-dog-pig-eyes'
        with:
          name: l6-task-workspace
          path: |
            /tmp/wanhu-task-source.tar
            /tmp/wanhu-task-dependencies.tar.gz
          retention-days: 1
      - name: Retired contract checks
        run: npm run check:retired
      - name: Core mesh and data checks
        run: npm run check:core
      - name: Back equipment topology, bind and Recipe V5 checks
        run: npx tsx scripts/check-back-equipment.ts
      - name: TypeScript and production build
        run: npm run build
      - name: Back equipment source-key animation and riding checks
        run: npx tsx scripts/check-back-equipment.ts --motion
