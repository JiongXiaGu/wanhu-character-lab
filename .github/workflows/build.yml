name: Build & Core Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: build-core-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REVIEW_HEAD_SHA }}
          persist-credentials: false
      - name: Record exact source
        run: test "$(git rev-parse HEAD)" = "$REVIEW_HEAD_SHA" && echo "$REVIEW_HEAD_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Export temporary camel task workspace
        if: github.head_ref == 'task/camel-bactrian-20260922'
        run: |
          git archive --format=tar HEAD | gzip > /tmp/wanhu-source.tar.gz
          tar -czf /tmp/wanhu-dependencies.tar.gz node_modules
          printf '%s\n' "$REVIEW_HEAD_SHA" > /tmp/wanhu-source-sha.txt
      - uses: actions/upload-artifact@v4
        if: github.head_ref == 'task/camel-bactrian-20260922'
        with:
          name: camel-task-workspace
          path: |
            /tmp/wanhu-source.tar.gz
            /tmp/wanhu-dependencies.tar.gz
            /tmp/wanhu-source-sha.txt
          retention-days: 1
      - name: Retired contract checks
        run: npm run check:retired
      - name: Core mesh and data checks
        run: npm run check:core
      - name: TypeScript and production build
        run: npm run build
