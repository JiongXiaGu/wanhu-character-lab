name: Build & Core Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: build-core-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REVIEW_HEAD_SHA }}
          persist-credentials: false
      - name: Record exact source
        run: test "$(git rev-parse HEAD)" = "$REVIEW_HEAD_SHA" && echo "$REVIEW_HEAD_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: CI graph and coverage guard checks
        run: node scripts/check-ci-graph.mjs
      - name: Retired contract checks
        run: npm run check:retired
      - name: Core mesh and data checks
        run: npm run check:core
      - name: Back equipment topology, bind and Recipe V5 checks
        run: npx tsx scripts/check-back-equipment.ts
      - uses: ./.github/actions/prepare-motion
      - name: TypeScript and production build
        run: npm run build --ignore-scripts
      - name: Back equipment source-key animation and riding checks
        run: npx tsx scripts/check-back-equipment.ts --motion
      - name: Checks must not mutate tracked source
        run: git diff --exit-code && test "$(git rev-parse HEAD)" = "$REVIEW_HEAD_SHA"
      # Temporary S6-5 authoring input transfer; remove before final candidate.
      # Only tracked source and public runtime dependencies, never credentials or test-result caches.
      - name: Package exact authoring inputs
        run: |
          git archive --format=tar.gz HEAD > /tmp/authoring-source.tar.gz
          tar -czf /tmp/authoring-runtime.tar.gz node_modules public/mixamo public/system-animator
          printf '%s\n' "$REVIEW_HEAD_SHA" > /tmp/AUTHORING_SOURCE_SHA
      - uses: actions/upload-artifact@v4
        with:
          name: s6-authoring-inputs-${{ env.REVIEW_HEAD_SHA }}
          path: |
            /tmp/authoring-source.tar.gz
            /tmp/authoring-runtime.tar.gz
            /tmp/AUTHORING_SOURCE_SHA
          retention-days: 1
