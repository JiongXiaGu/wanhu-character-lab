name: Prepare Wardrobe Evidence
on:
  push:
    branches: [review/wardrobe-evidence-5472912]
    paths: [.github/workflows/prepare-wardrobe-evidence.yml]
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/wardrobe-evidence-5472912
      - uses: actions/download-artifact@v4
        with:
          name: wardrobe-review
          run-id: 35460567625
          github-token: ${{ github.token }}
          path: /tmp/wardrobe-evidence-source
      - name: Install image utilities
        run: |
          python -m pip install Pillow
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Prepare contact sheets from original screenshots and full-duration video frames
        shell: bash
        run: |
          python - <<'PY'
          import json, math, shutil, subprocess
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          root = Path('/tmp/wardrobe-evidence-source')
          report_path = next(p for p in root.rglob('report.json') if 'records' in json.loads(p.read_text()))
          report = json.loads(report_path.read_text())
          assert report['sourceSha'] == '5472912384c637df695a9fa92b2c6f8777014371', report
          assert report['passed'] and report['images'] == 159 and len(report['continuousVideos']) == 4, report
          src = report_path.parent
          out = Path('review-evidence/5472912')
          out.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(report_path, out/'source-report.json')
          font = ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf', 15)
          def sheet(items, name, columns=3, crop=True):
              width, height = 560, 490 if crop else 380
              canvas = Image.new('RGB', (width*columns, height*math.ceil(len(items)/columns)), '#e9e7e0')
              draw = ImageDraw.Draw(canvas)
              for i,(p,label) in enumerate(items):
                  im = Image.open(p).convert('RGB')
                  if crop and im.width == 1600 and im.height == 1000:
                      im = im.crop((280,60,1300,920))
                  im.thumbnail((width-12,height-38))
                  x,y=(i%columns)*width,(i//columns)*height
                  canvas.paste(im,(x+(width-im.width)//2,y+30))
                  draw.text((x+8,y+7),label,fill='#18221e',font=font)
              canvas.save(out/name,quality=91)
          # Source frames are only cropped and arranged; no model rendering or retouching.
          for name in ['studio-default','studio-female','mobile-male','mobile-female','cross-body-diy','all-looks-unlocked','random-locked']:
              shutil.copyfile(src/(name+'.png'),out/(name+'.png'))
          looks=sorted({name[:-len('-front.png')] for name in report['records'] if name.endswith('-front.png')})
          for look in looks:
              files=[src/n for n in report['records'] if n.startswith(look+'-')]
              static=[p for p in files if '-jogging-' not in p.name and '-shooting-arrow-' not in p.name]
              motion=[p for p in files if '-jogging-' in p.name or '-shooting-arrow-' in p.name]
              sheet([(p,p.stem) for p in static],look+'-static.jpg')
              sheet([(p,p.stem) for p in motion],look+'-motion.jpg',columns=5)
          overview=[(src/(look+'-front.png'),look) for look in looks]
          sheet(overview,'eight-looks-front.jpg',columns=4)
          sequences=[]
          for video in report['continuousVideos']:
              path=src/video
              dest=Path('/tmp')/(path.stem+'-frames'); dest.mkdir(exist_ok=True)
              subprocess.run(['ffmpeg','-v','error','-i',str(path),'-vf','fps=4','-y',str(dest/'%05d.png')],check=True)
              frames=sorted(dest.glob('*.png'))
              names=[]
              for start in range(0,len(frames),20):
                  name=f'{path.stem}-frames-{start//20+1:02d}.jpg'
                  sheet([(p,f'{(start+j)/4:.2f}s') for j,p in enumerate(frames[start:start+20])],name,columns=4)
                  names.append(name)
              sequences.append({'sourceVideo':video,'frames':len(frames),'samplingFPS':4,'sheets':names})
          manifest={'sourceSha':report['sourceSha'],'testedSha':report['testedSha'],'runId':35460567625,'sourceImages':report['images'],'sourceVideos':report['continuousVideos'],'looks':looks,'videoSequences':sequences,'note':'Derived from original GitHub Actions artifact. Images are only cropped, resized and arranged; videos sampled across their full durations. Preparation is not a declaration of visual acceptance.','files':sorted(p.name for p in out.iterdir())}
          (out/'manifest.json').write_text(json.dumps(manifest,indent=2))
          for log in root.glob('*.log'):
              if log.name.startswith('wardrobe-'):
                  shutil.copyfile(log,out/log.name)
          print(json.dumps(manifest,indent=2))
          PY
      - name: Keep evidence on this isolated review branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add review-evidence/5472912
          git commit -m 'chore(review): retain exact 5472912 contact sheets and frame sequences [skip ci]'
          git push origin HEAD:review/wardrobe-evidence-5472912
      - uses: actions/upload-artifact@v4
        with:
          name: wardrobe-contact-sheets-5472912
          path: review-evidence/5472912
          retention-days: 7
