name: Mixamo Retarget Review
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: mixamo-review-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  retarget-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check:retired
      - name: Prepare FBX animation data and build
        run: npm run build 2>&1 | tee mixamo-build-review.log
      - name: Validate all clips and fixed bodies
        run: npm run check:mixamo 2>&1 | tee mixamo-numeric-review.log
      - name: Install browser and Chinese fonts
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Source-target visual and interaction review
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > preview.log 2>&1 &
          ready=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          npm run review:mixamo 2>&1 | tee mixamo-browser-review.log
      - name: Verify immutable source files
        run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mixamo-retarget-review
          path: |
            review-mixamo/
            mixamo-*-review.log
            public/mixamo/inventory.json
            preview.log
          retention-days: 7
