name: Integrate V2 Review Polish
on:
  push:
    branches: [tmp-wardrobe-v2-20260920]
    paths: [scripts/polish-v2.mjs, .github/workflows/polish-v2.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/polish-v2.mjs && node scripts/sync-v2-docs.mjs
      - run: npm ci
      - run: npm run build
      - name: Commit integrated polish
        run: |
          rm scripts/polish-v2.mjs scripts/sync-v2-docs.mjs .github/workflows/polish-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src scripts package.json .github Documentation AGENTS.md
          git commit -m 'fix: preserve LOD camera and add complete lifting and intersection review'
          git push origin HEAD:tmp-wardrobe-v2-20260920
