name: Visual Review

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - ".github/workflows/visual-review.yml"
  workflow_dispatch:

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate procedural mesh
        run: npm run check:mesh

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx --yes playwright@1.55.0 install --with-deps chromium

      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat preview.log
          exit 1

      - name: Capture review screenshots
        run: |
          mkdir -p review

          npx --yes playwright@1.55.0 screenshot --viewport-size="1920,1080" --wait-for-timeout=1200             'http://127.0.0.1:4173/?mode=overlay&projection=perspective&view=perspective&guides=0&grid=1'             review/01-perspective-overlay.png

          npx --yes playwright@1.55.0 screenshot --viewport-size="1920,1080" --wait-for-timeout=1200             'http://127.0.0.1:4173/?mode=overlay&projection=orthographic&view=front&guides=0&grid=0'             review/02-front-ortho-overlay.png

          npx --yes playwright@1.55.0 screenshot --viewport-size="1920,1080" --wait-for-timeout=1200             'http://127.0.0.1:4173/?mode=overlay&projection=orthographic&view=right&guides=0&grid=0'             review/03-right-ortho-overlay.png

          npx --yes playwright@1.55.0 screenshot --viewport-size="1920,1080" --wait-for-timeout=1200             'http://127.0.0.1:4173/?mode=overlay&projection=orthographic&view=top&guides=0&grid=0'             review/04-top-ortho-overlay.png

          npx --yes playwright@1.55.0 screenshot --viewport-size="1920,1080" --wait-for-timeout=1200             'http://127.0.0.1:4173/?mode=wireframe&projection=orthographic&view=front&guides=1&grid=0'             review/05-front-ortho-wire.png

      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: character-lowpoly-review
          path: review/*.png
          retention-days: 7
