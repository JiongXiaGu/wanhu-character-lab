name: Deformation analysis snapshot
on:
  push:
    branches: [fix/lowpoly-deformation-cages]
    paths: [.github/workflows/deformation-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run prepare:mixamo
      - name: Package numeric inputs only (no source FBX copies, git or credentials)
        run: |
          mkdir -p /tmp/deformation-small/public
          cp -a src scripts Documentation node_modules package.json package-lock.json tsconfig.json /tmp/deformation-small/
          cp -a public/mixamo /tmp/deformation-small/public/
          git rev-parse HEAD > /tmp/deformation-small/SNAPSHOT_SHA.txt
          du -sh node_modules src scripts public/mixamo
          tar -czf /tmp/deformation-small.tar.gz -C /tmp/deformation-small .
          ls -lh /tmp/deformation-small.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: deformation-numeric-inputs
          path: /tmp/deformation-small.tar.gz
          retention-days: 1
