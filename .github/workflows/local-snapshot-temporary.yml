name: Temporary skirt candidate
on:
  push:
    branches: [feat/closed-hems-true-skirts-20260921]
    paths: [.github/workflows/local-snapshot-temporary.yml, .github/skirt-edit.py]
permissions:
  contents: write
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Apply prepared source edits to this task branch only
        env:
          TASK_BRANCH: feat/closed-hems-true-skirts-20260921
        run: |
          test "$GITHUB_REF_NAME" = "$TASK_BRANCH"
          test "$(git ls-remote origin refs/heads/$TASK_BRANCH | cut -f1)" = "$(git rev-parse HEAD)"
          if test -f .github/skirt-edit.py; then
            python .github/skirt-edit.py
            git rm .github/skirt-edit.py
            git add src scripts package.json
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'feat: closed short cuffs and continuous short and long skirts'
            git push origin HEAD:refs/heads/$TASK_BRANCH
          fi
          echo "REVIEW_HEAD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - run: npm run check:mesh && npm run check:tailoring
      - name: Install actual browser
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install Pillow
      - name: Execute review local entry in runner
        run: npm run review:local -- --skirts
      - name: Verify rendering did not edit source
        run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skirt-candidate
          path: |
            review-wardrobe-batch/skirts-*
            review-tailoring-v2/intersections.json
          retention-days: 7
