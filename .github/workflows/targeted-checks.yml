name: Targeted Numeric Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: targeted-numeric-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      RIDING_CHECK_DIR: /tmp/wanhu-riding-checks
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REVIEW_HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Record exact source
        run: test "$(git rev-parse HEAD)" = "$REVIEW_HEAD_SHA" && echo "$REVIEW_HEAD_SHA"
      - id: scope
        name: Resolve changed subsystems
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          wardrobe=false; mixamo=false; tailoring=false; horse=false; riding=false; all=false
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            all=true; : > /tmp/changed-files.txt
          else
            if [[ "$EVENT_NAME" == "pull_request" ]]; then BASE="$PR_BASE_SHA"; else BASE="$PUSH_BEFORE_SHA"; if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]]; then BASE="$(git rev-parse HEAD^)"; fi; fi
            git diff --name-only "$BASE" HEAD | tee /tmp/changed-files.txt
          fi
          while IFS= read -r path; do
            case "$path" in .github/workflows/*|package.json|package-lock.json|scripts/review-local.mjs) all=true ;; esac
            case "$path" in src/character/wardrobe/*|src/character/wardrobe/**/*|src/character/v3/outfit.ts|src/character/v3/types.ts|scripts/check-wardrobe*|scripts/check-lightwear*|scripts/check-skirts*|scripts/garment-contact-scope.ts) wardrobe=true ;; esac
            case "$path" in src/character/mixamo/*|src/character/mixamo/**/*|public/mixamo/*|public/mixamo/**/*|src/animation/clip-clock.ts|scripts/check-mixamo*|scripts/prepare-mixamo.ts) mixamo=true ;; esac
            case "$path" in src/character/wardrobe/assets/*|src/character/wardrobe/assets/**/*|src/character/wardrobe/assembly.ts|src/character/v3/body.ts|src/character/v3/rig.ts|src/character/v3/leg-deformation.ts|scripts/check-tailoring*|scripts/garment-contact-scope.ts) tailoring=true ;; esac
            case "$path" in src/horse/*|src/horse/**/*|src/mounts/*|src/mounts/**/*|scripts/check-horse*|src/animation/clip-clock.ts) horse=true ;; esac
            case "$path" in src/riding/*|src/riding/**/*|src/horse/*|src/horse/**/*|src/mounts/*|src/mounts/**/*|src/donkey/*|src/donkey/**/*|src/camel/*|src/camel/**/*|src/cattle/*|src/cattle/**/*|src/yak/*|src/yak/**/*|src/character/v3/*|src/character/wardrobe/*|src/character/wardrobe/**/*|src/animation/clip-clock.ts|src/main.tsx|src/ui/AnimalModeSwitcher*|src/ui/WorkspaceSwitcher*|src/ui/MountSelector*|src/ui/mount-selector*|scripts/check-riding*|scripts/check-saddles*|scripts/check-mounts*|scripts/mount-check-helpers*|scripts/mount-camel-*|scripts/mount-cattle-*|scripts/mount-yak-*) riding=true ;; esac
          done < /tmp/changed-files.txt
          if [[ "$all" == "true" ]]; then wardrobe=true; mixamo=true; tailoring=true; horse=true; riding=true; fi
          if [[ "$wardrobe" == "true" || "$mixamo" == "true" || "$tailoring" == "true" || "$horse" == "true" || "$riding" == "true" ]]; then any=true; else any=false; fi
          { echo "wardrobe=$wardrobe"; echo "mixamo=$mixamo"; echo "tailoring=$tailoring"; echo "horse=$horse"; echo "riding=$riding"; echo "any=$any"; } >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.any == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.scope.outputs.any == 'true'
      - name: Multi-mount mesh, animation and riding checks
        if: steps.scope.outputs.riding == 'true'
        run: npm run check:mounts
      - name: Saddle topology, rein endpoints and sampled clearance
        if: steps.scope.outputs.riding == 'true'
        run: npm run check:saddles
      - name: Riding numeric and lifecycle checks
        if: steps.scope.outputs.riding == 'true'
        run: npm run check:riding
      - name: Install browser for riding interaction checks
        if: steps.scope.outputs.riding == 'true'
        run: npx playwright install --with-deps chromium
      - name: Multi-mount browser interaction checks (no screenshots)
        if: steps.scope.outputs.riding == 'true'
        run: npm run check:mounts-browser
      - name: Riding browser interaction checks (no screenshots)
        if: steps.scope.outputs.riding == 'true'
        run: npm run check:riding-browser
      - name: Saddle browser interaction checks (no screenshots)
        if: steps.scope.outputs.riding == 'true'
        run: npm run check:saddles-browser
      - name: Upload mount, riding and saddle reports
        if: always() && steps.scope.outputs.riding == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mounts-m4-checks
          path: ${{ env.RIDING_CHECK_DIR }}
          if-no-files-found: warn
          retention-days: 7
      - name: Prepare motion data
        if: steps.scope.outputs.mixamo == 'true' || steps.scope.outputs.tailoring == 'true'
        run: npm run prepare:mixamo
      - name: Wardrobe numeric checks
        if: steps.scope.outputs.wardrobe == 'true'
        run: npm run check:wardrobe-numeric
      - name: Mixamo numeric checks
        if: steps.scope.outputs.mixamo == 'true'
        run: npm run check:mixamo
      - name: Tailoring and intersection checks
        if: steps.scope.outputs.tailoring == 'true'
        run: npm run check:tailoring
      - name: Horse numeric checks
        if: steps.scope.outputs.horse == 'true'
        run: npm run check:horse
      - name: No subsystem-specific checks required
        if: steps.scope.outputs.any != 'true'
        run: echo "No targeted numeric checks required for this change set."
