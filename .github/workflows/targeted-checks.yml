name: Targeted Numeric Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      scope:
        description: Numeric review scope
        required: true
        type: choice
        default: auto
        options:
          - auto
          - soldier-heavy-authoring
          - soldier-heavy-candidate
          - full
concurrency:
  group: targeted-numeric-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  heavy-authoring:
    name: Heavy authoring fast lane
    if: github.event_name == 'workflow_dispatch' && inputs.scope == 'soldier-heavy-authoring'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      REVIEW_HEAD_SHA: ${{ github.sha }}
      SOLDIER_CHECK_DIR: /tmp/wanhu-heavy-authoring
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REVIEW_HEAD_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Heavy topology, bind, budget and silhouette contracts only
        run: npx tsx scripts/check-soldier-heavy-authoring.ts
      - name: Fast lane must not mutate tracked source
        run: git diff --exit-code && test "$(git rev-parse HEAD)" = "$REVIEW_HEAD_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soldier-heavy-authoring-${{ env.REVIEW_HEAD_SHA }}
          path: /tmp/wanhu-heavy-authoring/
          if-no-files-found: error
          retention-days: 7

  targeted:
    if: github.event_name != 'workflow_dispatch' || inputs.scope == 'auto' || inputs.scope == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      RIDING_CHECK_DIR: /tmp/wanhu-riding-checks
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REVIEW_HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Record exact source
        run: test "$(git rev-parse HEAD)" = "$REVIEW_HEAD_SHA" && echo "$REVIEW_HEAD_SHA"
      - id: scope
        name: Resolve changed subsystems
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SCOPE: ${{ inputs.scope || 'auto' }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          wardrobe=false; mixamo=false; tailoring=false; horse=false; riding=false; soldier=false; all=false
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$DISPATCH_SCOPE" == "auto" || "$DISPATCH_SCOPE" == "full" ]]
            all=true; : > /tmp/changed-files.txt
          else
            if [[ "$EVENT_NAME" == "pull_request" ]]; then BASE="$PR_BASE_SHA"; else BASE="$PUSH_BEFORE_SHA"; if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]]; then BASE="$(git rev-parse HEAD^)"; fi; fi
            git -c core.quotepath=false diff --name-only "$BASE" HEAD | tee /tmp/changed-files.txt
          fi
          while IFS= read -r path; do
            # Heavy author geometry/helmet sources are owned by soldier; do not fan them out
            # to generic wardrobe/tailoring/riding unless a shared runtime file also changed.
            case "$path" in
              src/character/wardrobe/assets/military/heavy-top.ts|src/character/wardrobe/assets/military/heavy-skirt.ts|src/character/wardrobe/heavy-equipment.ts|scripts/check-soldier-heavy.ts|scripts/check-soldier-heavy-authoring.ts|scripts/check-soldier-heavy-helmets.ts)
                soldier=true
                continue
                ;;
            esac
            case "$path" in .github/workflows/*|.github/actions/*|scripts/check-ci-*|scripts/check-soldier-motion-coverage.ts|package.json|package-lock.json|scripts/review-local.mjs) all=true ;; esac
            case "$path" in src/character/wardrobe/*|src/character/wardrobe/**/*|src/character/v3/outfit.ts|src/character/v3/types.ts|scripts/check-wardrobe*|scripts/check-lightwear*|scripts/check-skirts*|scripts/garment-contact-scope.ts) wardrobe=true ;; esac
            case "$path" in src/soldier/*|src/soldier/**/*|scripts/check-soldier*|Documentation/军人与甲胄工作流.md|Documentation/边疆戍卒与长枪.md|src/character/wardrobe/assets/military/*|src/character/wardrobe/assets/military/**/*|src/character/wardrobe/adornments.ts|src/character/wardrobe/frontier-equipment.ts|src/character/wardrobe/military-equipment.ts|src/character/wardrobe/catalog.ts|src/character/v3/types.ts) soldier=true ;; esac
            case "$path" in src/character/mixamo/*|src/character/mixamo/**/*|src/character/motion/*|src/character/motion/**/*|src/character/system-animator/*|src/character/system-animator/**/*|动画参考_glb/*|动画参考_glb/**/*|public/mixamo/*|public/mixamo/**/*|public/system-animator/*|public/system-animator/**/*|src/animation/clip-clock.ts|scripts/check-mixamo*|scripts/check-system-animator*|scripts/prepare-mixamo.ts|scripts/prepare-system-animator.ts|scripts/lib/system-animator-glb.ts) mixamo=true ;; esac
            case "$path" in src/character/wardrobe/assets/*|src/character/wardrobe/assets/**/*|src/character/wardrobe/assembly.ts|src/character/v3/body.ts|src/character/v3/rig.ts|src/character/v3/leg-deformation.ts|scripts/check-tailoring*|scripts/garment-contact-scope.ts) tailoring=true ;; esac
            case "$path" in src/horse/*|src/horse/**/*|src/mounts/*|src/mounts/**/*|scripts/check-horse*|src/animation/clip-clock.ts) horse=true ;; esac
            case "$path" in src/riding/*|src/riding/**/*|src/horse/*|src/horse/**/*|src/mounts/*|src/mounts/**/*|src/donkey/*|src/donkey/**/*|src/camel/*|src/camel/**/*|src/cattle/*|src/cattle/**/*|src/yak/*|src/yak/**/*|src/buffalo/*|src/buffalo/**/*|src/character/v3/*|src/character/wardrobe/*|src/character/wardrobe/**/*|src/animation/clip-clock.ts|src/main.tsx|src/ui/AnimalModeSwitcher*|src/ui/WorkspaceSwitcher*|src/ui/MountSelector*|src/ui/mount-selector*|scripts/check-riding*|scripts/check-saddles*|scripts/check-mounts*|scripts/mount-check-helpers*|scripts/mount-camel-*|scripts/mount-cattle-*|scripts/mount-yak-*|scripts/mount-buffalo-*) riding=true ;; esac
          done < /tmp/changed-files.txt
          if [[ "$all" == "true" ]]; then wardrobe=true; mixamo=true; tailoring=true; horse=true; riding=true; soldier=true; fi
          if [[ "$wardrobe" == "true" || "$mixamo" == "true" || "$tailoring" == "true" || "$horse" == "true" || "$riding" == "true" || "$soldier" == "true" ]]; then any=true; else any=false; fi
          { echo "wardrobe=$wardrobe"; echo "mixamo=$mixamo"; echo "tailoring=$tailoring"; echo "horse=$horse"; echo "riding=$riding"; echo "soldier=$soldier"; echo "any=$any"; } >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.any == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.scope.outputs.any == 'true'
      - name: Multi-mount mesh, animation and riding checks
        if: steps.scope.outputs.riding == 'true'
        run: npm run check:mounts
      - name: Saddle topology, rein endpoints and sampled clearance
        if: steps.scope.outputs.riding == 'true'
        run: npm run check:saddles
      - name: Riding numeric and lifecycle checks
        if: steps.scope.outputs.riding == 'true'
        run: npm run check:riding
      - name: Install browser for riding interaction checks
        if: steps.scope.outputs.riding == 'true'
        run: npx playwright install --with-deps chromium
      - name: Multi-mount browser interaction checks (no screenshots)
        if: steps.scope.outputs.riding == 'true'
        run: npm run check:mounts-browser
      - name: Riding browser interaction checks (no screenshots)
        if: steps.scope.outputs.riding == 'true'
        run: npm run check:riding-browser
      - name: Saddle browser interaction checks (no screenshots)
        if: steps.scope.outputs.riding == 'true'
        run: npm run check:saddles-browser
      - name: Upload mount, riding and saddle reports
        if: always() && steps.scope.outputs.riding == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mounts-m4-checks
          path: ${{ env.RIDING_CHECK_DIR }}
          if-no-files-found: warn
          retention-days: 7
      - name: Prepare motion data
        if: steps.scope.outputs.mixamo == 'true' || steps.scope.outputs.tailoring == 'true'
        uses: ./.github/actions/prepare-motion
      - name: Wardrobe numeric checks
        if: steps.scope.outputs.wardrobe == 'true'
        run: npm run check:wardrobe-numeric
      - name: Mixamo numeric checks
        if: steps.scope.outputs.mixamo == 'true'
        run: npm run check:mixamo
      - name: XR Animator GLB numeric checks
        if: steps.scope.outputs.mixamo == 'true'
        run: npm run check:system-animator
      # Full intersections have one owner: soldier, whose scope includes every tailoring input.
      - name: Tailoring topology and deformation checks
        if: steps.scope.outputs.tailoring == 'true'
        run: npx tsx scripts/check-tailoring-v2.ts
      - name: Horse numeric checks
        if: steps.scope.outputs.horse == 'true'
        run: npm run check:horse
      - name: No subsystem-specific checks required
        if: steps.scope.outputs.any != 'true'
        run: echo "No targeted numeric checks required for this change set."
  livestock:
    name: Livestock mesh, motion and desktop checks
    if: github.event_name != 'workflow_dispatch' || inputs.scope == 'auto' || inputs.scope == 'full'
    runs-on: ubuntu-latest
    # 六种家畜完整浏览器矩阵加睡眠专项，保留500只、多LOD与证据上传余量。
    timeout-minutes: 25
    env:
      REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      LIVESTOCK_CHECK_DIR: /tmp/wanhu-livestock-checks
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REVIEW_HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        name: Resolve livestock scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SCOPE: ${{ inputs.scope || 'auto' }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REVIEW_HEAD_SHA"
          required=false
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$DISPATCH_SCOPE" == "auto" || "$DISPATCH_SCOPE" == "full" ]]
            required=true
          else
            if [[ "$EVENT_NAME" == pull_request ]]; then BASE="$PR_BASE_SHA"; else BASE="$PUSH_BEFORE_SHA"; fi
            if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]]; then BASE="$(git rev-parse HEAD^)"; fi
            while IFS= read -r path; do
              case "$path" in src/livestock/*|src/chicken/*|src/duck/*|src/goose/*|src/pig/*|src/dog/*|src/cat/*|src/ui/AnimalModeSwitcher*|src/ui/animal-mode-switcher*|src/ui/WorkspaceSwitcher*|src/horse/horse.css|src/main.tsx|src/styles.css|src/animation/clip-clock.ts|scripts/check-livestock*|package.json|package-lock.json|.github/workflows/*|.github/actions/*) required=true ;; esac
            done < <(git -c core.quotepath=false diff --name-only "$BASE" HEAD)
          fi
          echo "required=$required" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.required == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.scope.outputs.required == 'true'
      - name: Chicken, duck, goose, pig, dog and cat topology, actual skinning and crowd checks
        if: steps.scope.outputs.required == 'true'
        run: npm run check:livestock
      - name: Prepare verified motion inputs
        if: steps.scope.outputs.required == 'true'
        uses: ./.github/actions/prepare-motion
      - name: Check TypeScript
        if: steps.scope.outputs.required == 'true'
        run: npx tsc --noEmit
      - name: Install desktop browser
        if: steps.scope.outputs.required == 'true'
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      # 截图会改变时序；visual PR也先跑普通入口，两份报告隔离保留。
      - name: Desktop interactions (no screenshots)
        if: steps.scope.outputs.required == 'true'
        env:
          LIVESTOCK_CHECK_DIR: /tmp/wanhu-livestock-checks/no-screenshots
        run: npm run check:livestock-browser
      - name: Desktop interactions and explicitly requested visual evidence
        if: steps.scope.outputs.required == 'true' && github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[visual]')
        env:
          LIVESTOCK_CHECK_DIR: /tmp/wanhu-livestock-checks/with-screenshots
        run: npm run review:livestock
      - name: Upload livestock reports and requested screenshots
        if: always() && steps.scope.outputs.required == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: livestock-l1-${{ env.REVIEW_HEAD_SHA }}
          path: |
            /tmp/wanhu-livestock-checks/
            review/livestock/
          if-no-files-found: warn
          retention-days: 14

  prepare-soldier:
    name: Prepare shared soldier motion inputs
    if: github.event_name != 'workflow_dispatch' || inputs.scope != 'soldier-heavy-authoring'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      required: ${{ steps.scope.outputs.required }}
      motion_matrix: ${{ steps.scope.outputs.motion_matrix }}
      browser_matrix: ${{ steps.scope.outputs.browser_matrix }}
      coverage_required: ${{ steps.scope.outputs.coverage_required }}
    env:
      REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REVIEW_HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        name: Resolve soldier scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SCOPE: ${{ inputs.scope || 'auto' }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REVIEW_HEAD_SHA"
          required=false
          motion_matrix='["light","medium","heavy"]'
          browser_matrix='["fitting","full"]'
          coverage_required=true
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            case "$DISPATCH_SCOPE" in
              soldier-heavy-candidate)
                required=true
                motion_matrix='["heavy"]'
                browser_matrix='["fitting"]'
                coverage_required=false
                ;;
              auto|full)
                required=true
                ;;
              *)
                required=false
                coverage_required=false
                ;;
            esac
          else
            if [[ "$EVENT_NAME" == pull_request ]]; then BASE="$PR_BASE_SHA"; else BASE="$PUSH_BEFORE_SHA"; fi
            if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]]; then BASE="$(git rev-parse HEAD^)"; fi
            while IFS= read -r path; do
              case "$path" in src/soldier/*|src/character/*|src/scene/CharacterViewport.tsx|src/App.tsx|src/animation/*|scripts/check-ci-*|scripts/review-local.mjs|scripts/check-soldier*|scripts/check-garment*|scripts/check-components*|scripts/check-tailoring*|scripts/garment-contact-scope.ts|scripts/prepare-*|scripts/lib/*|public/mixamo/*|public/system-animator/*|public/mediapipe/*|动画参考/*|动画参考_glb/*|Documentation/皇宫禁卫与长枪.md|Documentation/军人与甲胄工作流.md|Documentation/边疆戍卒与长枪.md|package.json|package-lock.json|.github/workflows/*|.github/actions/*) required=true ;; esac
            done < <(git -c core.quotepath=false diff --name-only "$BASE" HEAD)
          fi
          {
            echo "required=$required"
            echo "motion_matrix=$motion_matrix"
            echo "browser_matrix=$browser_matrix"
            echo "coverage_required=$coverage_required"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.required == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.scope.outputs.required == 'true'
      - uses: ./.github/actions/prepare-motion
        if: steps.scope.outputs.required == 'true'
      - name: Bundle exact motion inputs once for all soldier lanes
        if: steps.scope.outputs.required == 'true'
        run: |
          mkdir -p /tmp/prepared-soldier-motion
          printf '%s\n' "$REVIEW_HEAD_SHA" > /tmp/prepared-soldier-motion/SOURCE_SHA
          tar -czf /tmp/prepared-soldier-motion/motion.tar.gz public/mixamo public/system-animator src/character/mixamo/catalog.generated.ts src/character/system-animator/catalog.generated.ts
      - uses: actions/upload-artifact@v4
        if: steps.scope.outputs.required == 'true'
        with:
          name: prepared-soldier-motion-${{ env.REVIEW_HEAD_SHA }}
          path: /tmp/prepared-soldier-motion/
          compression-level: 0
          retention-days: 2

  soldier:
    name: Soldier static contracts and full intersections
    needs: prepare-soldier
    if: needs.prepare-soldier.outputs.required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SOLDIER_CHECK_DIR: /tmp/wanhu-soldier-checks/numeric
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REVIEW_HEAD_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/restore-motion
        with:
          source-sha: ${{ env.REVIEW_HEAD_SHA }}
      - name: Closed soldier assets, identity, wardrobe and fault injection
        run: npm run check:soldier
      - name: Full existing lower-body intersection regression
        if: ${{ !cancelled() }}
        run: npx tsx scripts/check-tailoring-intersections.ts
      - name: Preserve full intersection diagnostics
        if: always()
        run: |
          mkdir -p /tmp/wanhu-soldier-checks/intersections
          if [[ -f review-tailoring-v2/intersections.json ]]; then cp review-tailoring-v2/intersections.json /tmp/wanhu-soldier-checks/intersections/; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soldier-checks-${{ env.REVIEW_HEAD_SHA }}
          path: /tmp/wanhu-soldier-checks/
          retention-days: 14

  soldier-motion:
    name: Soldier source-key motion (${{ matrix.armor }})
    needs: prepare-soldier
    if: needs.prepare-soldier.outputs.required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        armor: ${{ fromJSON(needs.prepare-soldier.outputs.motion_matrix) }}
    env:
      REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SOLDIER_CHECK_DIR: /tmp/wanhu-soldier-motion
      SOLDIER_MOTION_ARMOR: ${{ matrix.armor }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REVIEW_HEAD_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/restore-motion
        with:
          source-sha: ${{ env.REVIEW_HEAD_SHA }}
      # Same real vertices, source keys and midpoints; only the outer armor loop is partitioned.
      - name: Actual skinned source keys and midpoints
        run: npx tsx scripts/check-soldier-assets.ts --motion
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soldier-motion-${{ env.REVIEW_HEAD_SHA }}-${{ matrix.armor }}
          path: /tmp/wanhu-soldier-motion/
          if-no-files-found: error
          retention-days: 14

  soldier-browser:
    name: Soldier browser (${{ matrix.mode }})
    needs: prepare-soldier
    if: needs.prepare-soldier.outputs.required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: ${{ fromJSON(needs.prepare-soldier.outputs.browser_matrix) }}
    env:
      REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SOLDIER_BROWSER_DIR: /tmp/wanhu-soldier-browser
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REVIEW_HEAD_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/restore-motion
        with:
          source-sha: ${{ env.REVIEW_HEAD_SHA }}
      - name: Install desktop browser
        run: npx playwright install --with-deps chromium
      - name: S6-3 focused fitting browser interactions
        if: matrix.mode == 'fitting'
        run: node scripts/check-soldier-fitting-browser.mjs
      - name: Soldier full desktop interactions without screenshots
        if: matrix.mode == 'full'
        run: npm run check:soldier-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soldier-browser-${{ env.REVIEW_HEAD_SHA }}-${{ matrix.mode }}
          path: /tmp/wanhu-soldier-browser/
          retention-days: 14

  soldier-motion-coverage:
    name: Verify complete soldier motion matrix
    needs: [prepare-soldier, soldier-motion]
    if: ${{ !cancelled() && needs.prepare-soldier.outputs.required == 'true' && needs.prepare-soldier.outputs.coverage_required == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REVIEW_HEAD_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/restore-motion
        with:
          source-sha: ${{ env.REVIEW_HEAD_SHA }}
      - uses: actions/download-artifact@v4
        with:
          pattern: soldier-motion-${{ env.REVIEW_HEAD_SHA }}-*
          path: /tmp/soldier-motion-reports
      - name: Reject missing, duplicate or stale shards and any missing pose cases
        run: npx tsx scripts/check-soldier-motion-coverage.ts /tmp/soldier-motion-reports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soldier-motion-coverage-${{ env.REVIEW_HEAD_SHA }}
          path: review/soldier-motion-coverage.json
          if-no-files-found: error
          retention-days: 14
