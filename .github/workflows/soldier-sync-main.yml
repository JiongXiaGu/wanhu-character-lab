name: Temporary Soldier Main Reconciliation
on:
  push:
    branches: [feat/soldier-palace-s1]
    paths: [.github/workflows/soldier-sync-main.yml]
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/soldier-palace-s1
          fetch-depth: 0
      - name: Preserve the verified parallel documentation additions
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = 9b76124b12490b6c100477d107d7551765ec5534
          python - <<'PY'
          from pathlib import Path
          from subprocess import check_output
          from difflib import SequenceMatcher
          main='9b76124b12490b6c100477d107d7551765ec5534'
          base='95f231f7eb0ec3cd45f4583b3a86f3a889203d55'
          def show(ref,path):return check_output(['git','show',f'{ref}:{path}']).decode()
          paths=check_output(['git','-c','core.quotepath=false','diff','--name-only',base,main]).decode().splitlines()
          expected=['AGENTS.md','Documentation/动物工作流.md','Documentation/工作交接.md','Documentation/项目概览.md','README.md']
          assert sorted(paths)==sorted(expected),paths
          for path in paths:
              incoming=show(main,path)
              if path in ['Documentation/动物工作流.md','Documentation/项目概览.md']:
                  if path.endswith('项目概览.md'):assert Path(path).read_text()==show(base,path)
                  Path(path).write_text(incoming)
                  continue
              a=show(base,path).splitlines(keepends=True);b=incoming.splitlines(keepends=True)
              added=[]
              for tag,i,j,k,l in SequenceMatcher(None,a,b,autojunk=False).get_opcodes():
                  assert tag in ['equal','insert'],(path,tag)
                  if tag=='insert':added.extend(b[k:l])
              text=''.join(added)
              assert text.strip().startswith('## '),(path,text)
              current=Path(path).read_text()
              if path=='AGENTS.md':current=text+current
              else:
                  title,rest=current.split('\n',1)
                  current=title+'\n\n'+text+rest
              Path(path).write_text(current)
          PY
          git rm .github/workflows/soldier-sync-main.yml
          git add AGENTS.md README.md Documentation
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          TREE=$(git write-tree)
          MERGE=$(printf 'Merge parallel animal workflow documentation into palace S1\n' | git commit-tree "$TREE" -p HEAD -p origin/main)
          git reset --hard "$MERGE"
          git push origin HEAD:feat/soldier-palace-s1
          git rev-parse HEAD
