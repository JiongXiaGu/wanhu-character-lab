name: Labor Action Review
on:
  push:
    branches: [main, feat/labor-actions-a]
    paths: ['src/**', 'scripts/**', 'package*.json', '.github/workflows/action-review.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: labor-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  labor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate body and original animations
        run: npm run check:mesh | tee mesh-review.log
      - name: Validate all action contacts and playback contracts
        run: npm run check:actions | tee action-review.log
      - run: npm run build
      - name: Prepare actual WebGL browser
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Capture every action and test interactions
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > preview.log 2>&1 &
          ready=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          npm run review:actions
      - name: Verify immutable tested source
        run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: labor-actions-review
          path: |
            review-actions/
            action-review.log
            mesh-review.log
            preview.log
          retention-days: 7
