name: Integrate Tailoring V2
on:
  push:
    branches: [tmp-wardrobe-v2-20260920]
    paths: [scripts/apply-tailoring-v2.mjs, .github/workflows/integrate-tailoring-v2.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/apply-tailoring-v2.mjs
      - run: npm ci
      - run: npm run build
      - run: npm run check:mesh
      - name: Commit integrated sources
        run: |
          rm scripts/apply-tailoring-v2.mjs .github/workflows/integrate-tailoring-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src scripts package.json .github Documentation README.md AGENTS.md
          git commit -m 'feat: integrate FBX test library and continuous garment V2'
          git push origin HEAD:tmp-wardrobe-v2-20260920
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-animation-inventory
          path: public/mixamo/inventory.json
